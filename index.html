<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mikalai Tucha — Visual Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e6e5d8;
      --black: #000000;
      --border: 2px solid #000000;
      --header-h: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--black);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header — увеличены надписи и отступы */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 3vw, 48px);
      height: var(--header-h);
      font-size: clamp(16px, 1.2vw, 20px);
      font-weight: 700;
      letter-spacing: 0.04em;
      border-bottom: var(--border);
    }

    nav {
      display: flex;
      gap: clamp(24px, 2.5vw, 40px);
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Hero Section — подогнан под пропорции 1920x1080 */
    .hero {
      min-height: calc(100vh - var(--header-h));
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: clamp(30px, 4vh, 60px) clamp(24px, 3vw, 48px) 60px;
      box-sizing: border-box;
    }

    /* SVG заголовок растягивается точно от края до края контейнера */
    .hero-title-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .hero-title-svg text {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 142px;
      fill: var(--black);
      letter-spacing: -3px;
    }

    /* Текст поднят прямо к заголовку */
    .hero p {
      margin-top: clamp(20px, 3vh, 40px);
      font-size: clamp(20px, 2.2vw, 38px);
      max-width: 1350px;
      font-weight: 400;
      line-height: 1.28;
      letter-spacing: -0.01em;
    }

    /* Section Headers */
    .section-bar {
      background: var(--black);
      color: var(--bg);
      padding: 16px clamp(24px, 3vw, 48px);
      font-size: clamp(20px, 1.8vw, 34px);
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    /* Works Grid */
    .works-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: var(--border);
    }

    .work-item {
      background: var(--bg);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 2vw, 38px);
      font-weight: 600;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .work-item:nth-child(odd) {
      border-right: var(--border);
    }

    .work-item:not(:nth-last-child(-n+2)) {
      border-bottom: var(--border);
    }

    .work-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .work-item:hover img {
      transform: scale(1.03);
    }

    /* Info Section */
    .info-content {
      padding: clamp(40px, 6vw, 100px) clamp(24px, 3vw, 48px);
      max-width: 1400px;
    }

    .info-content p {
      font-size: clamp(18px, 2vw, 36px);
      font-weight: 400;
      margin-bottom: 28px;
      line-height: 1.35;
    }

    /* Contact Section */
    .contact-section {
      background: var(--black);
      color: #ffffff;
      padding: 24px clamp(24px, 3vw, 48px) clamp(60px, 8vw, 120px);
      border-top: var(--border);
    }

    .contact-section .section-bar {
      padding: 0 0 20px 0;
      border-bottom: 1px solid #333333;
      margin-bottom: clamp(30px, 4vw, 60px);
    }

    .contact-title {
      font-size: clamp(24px, 3vw, 52px);
      font-weight: 500;
      line-height: 1.25;
      margin-bottom: clamp(36px, 4vw, 70px);
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-links a {
      font-size: clamp(20px, 2vw, 36px);
      font-weight: 700;
      letter-spacing: 0.04em;
      display: inline-block;
      width: fit-content;
      transition: opacity 0.2s;
    }

    .contact-links a:hover {
      opacity: 0.65;
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px clamp(24px, 3vw, 48px);
      font-size: clamp(14px, 1.1vw, 18px);
      border-top: var(--border);
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-img-wrap {
      max-width: 90vw;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img-wrap img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .lightbox-placeholder {
      width: 60vw;
      height: 60vh;
      background: var(--bg);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
    }

    .lightbox-caption {
      color: #e6e5d8;
      margin-top: 24px;
      font-size: clamp(16px, 1.4vw, 24px);
      text-align: center;
      max-width: 900px;
      line-height: 1.4;
      font-weight: 400;
    }

    .lightbox-btn {
      position: absolute;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 44px;
      cursor: pointer;
      user-select: none;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .lightbox-btn:hover {
      opacity: 0.6;
    }

    .lightbox-close {
      top: 20px;
      right: 28px;
      font-size: 48px;
      line-height: 1;
    }

    .lightbox-prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-width: 768px) {
      .works-grid {
        grid-template-columns: 1fr;
      }
      .work-item:nth-child(odd) {
        border-right: none;
      }
      .work-item {
        border-bottom: var(--border) !important;
      }
      .lightbox-prev {
        left: 5px;
      }
      .lightbox-next {
        right: 5px;
      }
      .hero {
        min-height: auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>MIKALAI TUCHA</div>
    <nav>
      <a href="#works">WORKS</a>
      <a href="#info">INFO</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <section class="hero">
    <!-- SVG заголовок: занимает ровно 100% ширины на 1920px и любых других экранах -->
    <svg class="hero-title-svg" viewBox="0 0 1675 145">
      <text x="0" y="125">VISUAL SOLUTIONS</text>
    </svg>
    <p>Graphic design, art direction & consulting.<br>
    Working on visual identities, print design, packaging, posters & art projects, etc.</p>
  </section>

  <div class="section-bar" id="works">01 / SELECTED WORKS</div>
  
  <section class="works-grid" id="worksGrid"></section>

  <div class="section-bar" id="info">02 / INFO</div>
  <section class="info-content">

    I’m a multidisciplinary graphic designer and visual artist.</p>
